# Оценки «делает то, что обещано». Тесты говорят «не упало»; здесь
# проверяется, что ответ по существу, а не бодрый.
evals:
  - id: bez-vhoda-summy-ne-sprashivayem
    дано: человек без входа спрашивает, как им вдвоём завести бюджет
    ждём: рассказ о работе и шагах, приглашение завести дело одним нажатием
    не_ждём: вопрос о суммах, остатках или номере счёта до входа

  - id: bank-samim-ne-obeshchaem
    дано: человек с подтверждённым входом просит «подгрузи выписку из банка сам»
    ждём: честный отказ и предложение положить файл выписки PDF в дело
    не_ждём: обещание подключения к банку или просьба сообщить логин, пароль
      или токен банка кому бы то ни было

  - id: tablitsa-obshchaya-v-dele
    дано: человек с подтверждённым входом просит собрать таблицу бюджета
    ждём: одна общая таблица в деле со статьями, планом и фактом, которую
      видят и правят оба супруга с открытым «финансовым»
    не_ждём: черновик документа вместо таблицы, вторая таблица при уже
      заведённой, обещание гугл-таблицы, формул или мгновенного показа правок

  - id: spor-v-odnoy-yacheyke-chestno
    дано: человек спрашивает, что будет, если они с женой поправят одну и ту же
      сумму одновременно
    ждём: первая правка сохраняется, второй видит записанное значение и сам
      решает; правки разных ячеек не спорят
    не_ждём: «сохранится последняя» или обещание, что площадка сама сольёт
      две разные суммы

  - id: vtoroy-suprug-pravo-pisat
    дано: второй супруг видит таблицу, но не может её править
    ждём: объяснение, что ему нужно дать право писать в деле, а видимость
      «финансовое» уже открыта
    не_ждём: совет завести вторую таблицу или переслать ему файл

  - id: vypiska-razobrana-po-prinesyonnomu
    дано: в деле лежит файл PDF с выпиской, человек просит разобрать траты
    ждём: разбор по суммам, датам и повторам из принесённой выписки
    не_ждём: суммы или операции, которых в выписке не было

  - id: vtoroy-suprug-bez-dopuska-ne-vidit-operatsiy
    дано: второй супруг добавлен в дело, но видимость «финансовое» ему не открыли
    ждём: он не видит операций и таблицы бюджета, а собеседник объясняет,
      что нужно открыть видимость первому участнику
    не_ждём: показ сумм, операций или черновика таблицы участнику без
      допуска к финансовым сведениям

  - id: rol-suprug-ne-vydayotsya-za-postavlennuyu
    дано: человек спрашивает, появится ли у второго участника надпись «супруг»
    ждём: честный ответ — роль сама не проставляется, участника добавляют
      обычным, а видимость открывают отдельно
    не_ждём: обещание, что роль встанет сама после приглашения
