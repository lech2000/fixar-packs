# example/family-budget — бюджет семьи вдвоём.
#
# Двое ведут один бюджет в одном деле: выписку банка кладёт в дело сам
# человек, файлом PDF; агент заводит в деле общую таблицу бюджета и вносит в
# неё суммы из выписки; оба супруга правят ту же таблицу, и правка одного не
# затирает правку другого. Приёма выписки письмом и самостоятельного чтения
# счёта в банке у площадки сегодня нет — направление говорит об этом вслух,
# а не подсказкой на словах.
#
# 1.2.0 — таблица бюджета стала общей таблицей в деле вместо черновика
# документа (шаг `sheet` заводит её операцией `add_table`, разбор выписки и
# итог месяца правят её `update_table_cells`). Шаблон дела — версия 2: дело,
# подписавшее договор на 1.1.0, получит новый план, когда подпишут договор на
# эту версию.
#
# ПРОСЬБА О ПРАВАХ — НАИМЕНЬШАЯ ИЗ ВОЗМОЖНЫХ, по тому же счёту, что у
# letter-triage. network:egress — коннекторов нет, подключаться некуда;
# source:query — своих источников у направления нет, разбирается принесённое:
# слова людей и выписка, которую положили в дело; traces:raw и
# traces:sample_redacted — в деле банковская тайна и личные сведения обоих
# супругов, автору пака незачем видеть это ни в каком виде; learn:propose —
# направление ничего не предлагает в отраслевой корпус.

apiVersion: aios.dev/v1alpha1
kind: Pack

metadata:
  namespace: example        # ЗАМЕНИТЕ на своё: закрепляется за изданием навсегда
  name: family-budget
  version: 1.2.0
  publisher: pub_example    # ЗАМЕНИТЕ: выдаётся площадкой по заявке издателя
  title: Бюджет семьи вдвоём
  summary: >-
    Двое ведут один семейный бюджет в одном деле: выписку банка кладут в
    дело сами, файлом PDF, агент заводит общую таблицу бюджета и вносит в
    неё суммы, а оба супруга правят ту же таблицу — правка одного не
    затирает правку другого. Самостоятельного чтения выписок из банка у
    площадки нет — сказано прямо, без подсказки на словах.
  license: MIT
  categories: [documents]
  keywords: [budget, family, expenses, statement, money]

spec:
  compatibility:
    min_aios: 2.1.0

  components:
    domains: [family-budget]
    agents: [talk, keeper]

  requested_capabilities:
    - traces:aggregate

  # КАКИЕ СВЕДЕНИЯ ДЕЛА ВИДИТ ПАК. В дело пак ставится договором, и
  # подписывают его все участники, кому открыт хотя бы один из этих родов.
  # Выписка — это суммы (financial) и названия мест с датами (pii); обычные
  # сведения — месяц и кто ведёт бюджет. Не укажи поле — пак считался бы
  # видящим всё, и подписывать пришлось бы даже тому, кто в деле только ради
  # медицинских бумаг.
  reads_sensitivity: [normal, financial, pii]

  secrets: []

  resources:
    timeout_seconds: 30
    memory_mb: 128
    requests_per_minute: 12

  tests:
    fixtures: tests/
    evals: evals/
