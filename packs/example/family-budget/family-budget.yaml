# Направление: бюджет семьи вдвоём.
#
# Двое ведут ОДНО дело о бюджете: заполняют, кто в семье и на какой месяц
# считаем, кладут в дело выписку банка PDF-файлом, просят разбор трат и
# заводят общую таблицу бюджета, которую правят оба. Отвечает по
# принесённому — по выписке и по словам людей, — и прямо говорит, чего у
# площадки нет: приёма выписки письмом и самостоятельного чтения счёта в
# банке.
#
# ══ ПОЧЕМУ ЗДЕСЬ ДВА АГЕНТА, А НЕ ОДИН ══
#
# Тот же довод, что у другого направления этой же площадки про деньги семьи:
# поставь единственному агенту `min_assurance: 2` ради допуска к деньгам — и
# человек без входа на «как нам вдвоём завести бюджет» получит «подходящего
# агента нет». Тупик без ответа хуже честного «это будет после входа».
#
# Разводим СПОСОБНОСТЬЮ, не порогом: `talk` говорит и объясняет кому угодно,
# денег не видит и дела не ведёт; `keeper` ведёт дело и видит деньги, вход
# подтверждён. Шаблон дела требует `case_patch` — значит дело закрепляется
# за `keeper`, а `talk` остаётся тем, с кем можно поговорить до дела.
#
# ══ МОДЕЛЬ ВЫБРАНА РАЗНО ДЛЯ ДВУХ АГЕНТОВ, И ВОТ ПОЧЕМУ ══
#
# `talk` не видит ничего, кроме обычных сведений (`normal`), и разговор
# короткий — под это годится местная модель площадки: она не покидает своё
# железо, и гонять через неё внешний мост незачем.
#
# `keeper` работает с выпиской и суммами — банковской тайной и личными
# сведениями сразу. Местной или российской модели с таким запасом контекста
# для разбора выписки и ведения дела сегодня нет: местная держит в разговоре
# заметно меньше текста, чем разбор выписки плюс история дела требуют.
# Российская облачная (GigaChat, Cloud.ru) в реестре моделей объявлена, но по
# нашему же опыту доступ к ней рвётся каждые тридцать минут без способа
# продлить его через API — на шаг, которого просят посреди разговора, такая
# опора не годится. Поэтому `keeper` работает через ту же облачную модель,
# что и «Деньги семьи» (`mimo-v2.5`), а это означает вынос за периметр
# площадки: выписка и суммы уходят внешнему мосту. Согласие на трансграничную
# передачу площадка сегодня спрашивает не на всех входных дверях (не в
# Telegram, не в мессенджере, не в API) — то есть человек, вошедший таким
# путём, мог не увидеть этот вопрос вовсе. Это риск площадки, а не пакета:
# пакет не может сузить это сам — предела юрисдикции у шаблона дела в схеме
# нет, он живёт на самом деле. Названо здесь и в README, чтобы не выглядеть
# незамеченным.
#
# ══ ЧЕГО ЗДЕСЬ НЕТ, И ЭТО НАЗВАНО ВСЛУХ ══
#
#   * таблица бюджета     — ДА, шагом `sheet`: агент заводит в деле ОБЩУЮ
#                            таблицу (с версии пака 1.2.0; раньше это был
#                            черновик документа);
#   * разбор выписки      — ДА, шагом `statement_review`, по тому, что
#                            человек сам положил в дело файлом PDF; суммы из
#                            выписки агент вносит в ту же общую таблицу;
#   * общая таблица       — ДА, умением `shared_sheet`: видят и правят оба,
#                            кому открыто «финансовое». У каждой ячейки своя
#                            версия: правки разных ячеек не спорят, а если
#                            двое поправили одну и ту же, второй видит, что
#                            сохранил первый, и решает сам. Чего НЕТ: гугл-
#                            и яндекс-таблиц, формул, своих столбцов после
#                            создания; правку другого открытая таблица
#                            подтягивает раз в несколько секунд, а не
#                            мгновенно;
#   * приём выписки почтой — НЕТ. Площадка не принимает письма на адрес дела
#                            и не проверяет, что письмо действительно от
#                            банка. Названо умением `bank_statement_by_mail`
#                            (`mode: not_built`);
#   * чтение счёта банком  — НЕТ. У банков нет входа для стороннего сервиса
#                            к операциям личного счёта. Названо умением
#                            `bank_pull` (`mode: not_built`);
#   * роль «супруг» второму сразу при приглашении — НЕТ. Второго добавляют
#                            обычным участником дела, и видимость финансовых
#                            сведений включают ЯВНО в момент приглашения —
#                            это работает. Не работает автоматическая роль
#                            из объявленной здесь пары `spouse`/`spouse` —
#                            названо умением `spouse_invite_role`
#                            (`mode: not_built`).

id: family-budget
title: Бюджет семьи вдвоём
version: 2
description: >
  Двое ведут один бюджет: заполняют, кто в семье и на какой месяц считаем,
  кладут в дело выписку банка PDF-файлом, получают разбор трат и общую
  таблицу бюджета, которую правят оба. Это не инвестиции и не советы, куда вложить деньги; спор с банком
  ведёт право, а покупку жилья — недвижимость.

party_roles:
  # Пара симметричная: оба супруга друг для друга — «супруг». В отличие от
  # `budget_keeper`/`household_member` направления «Деньги семьи», здесь нет
  # причины разводить роли: оба в равной мере ведут один и тот же бюджет.
  - {role: spouse, title: Супруг или супруга, likely_user: true, reciprocal: spouse}

entity_types:
  - type: account
    title: Счёт или карта
    plural: Счета и карты
    sensitivity: financial
    fields:
      - {key: bank, title: Банк, kind: text, required: true}
      - {key: owner, title: Чья карта, kind: text, required: true}
      - {key: last4, title: Последние 4 цифры, kind: text,
         pattern: "^[0-9]{4}$",
         pattern_hint: "ровно 4 цифры, без пробелов и букв"}

  - type: operation
    title: Операция
    plural: Операции
    sensitivity: financial
    fields:
      - {key: date, title: Дата, kind: date, required: true}
      - {key: amount, title: Сумма, kind: money, required: true, unit: руб.}
      - {key: category, title: Статья, kind: text}
      - {key: spent_by, title: Кто потратил, kind: text}
      - {key: description, title: Описание, kind: text}

  - type: budget_item
    title: Статья бюджета
    plural: Статьи бюджета
    sensitivity: financial
    fields:
      - {key: category, title: Статья, kind: text, required: true}
      - {key: monthly_limit, title: Лимит на месяц, kind: money, unit: руб.}

platform_abilities:
  - key: budget_sheet
    title: Собрать таблицу бюджета на месяц
    mode: own_corpus
    note: >
      Статьи, план и факт — ОБЩЕЙ ТАБЛИЦЕЙ в деле: её видят и правят оба
      супруга, кому открыто «финансовое». Итоги по числовым столбцам
      считаются сами; таблицу можно скачать файлом CSV.

  - key: statement_review
    title: Разобрать выписку, которую вы положили в дело
    mode: own_corpus
    note: >
      По PDF-файлу выписки, который вы сами добавили в дело: куда уходит
      больше всего, что повторяется, что выбивается из обычного месяца.
      Если в деле уже есть таблица бюджета, суммы из выписки агент вносит
      в неё сам, без отдельного подтверждения, — ячейку, которую вы успели
      поправить, он не перезаписывает.

  - key: shared_sheet
    title: Вести одну таблицу, которую правят оба одновременно
    mode: own_corpus
    note: >
      Таблица живёт в самом деле, а не в гугл- или яндекс-документе. Правят
      её участники, у которых есть право писать в деле и открыто
      «финансовое». Каждая ячейка сохраняется отдельно: правки разных ячеек
      не мешают друг другу, а если двое поправили одну и ту же, второй видит
      значение первого и выбирает сам — молча ничего не теряется. Правку
      другого открытая таблица показывает через несколько секунд, правку
      агента — когда он закончит шаг. Столбцы задаются при создании и потом
      не меняются; формул нет, итоги по числам считаются сами.

  - key: bank_statement_by_mail
    title: Получать выписку письмом на адрес дела
    mode: not_built
    note: >
      Этого пока нет. Выписку в дело кладёте вы сами файлом PDF. Приём
      письма на собственный адрес дела с проверкой, что оно действительно от
      банка, — в плане у площадки, не сегодня.

  - key: bank_pull
    title: Забирать выписку из банка самим
    mode: not_built
    note: >
      Этого у площадки нет: у банков нет входа для стороннего сервиса к
      операциям личного счёта. Выписку выгружаете вы сами — в приложении
      банка, файлом PDF.

  - key: spouse_invite_role
    title: Пригласить супруга ролью «супруг» с правильным доступом сразу
    mode: not_built
    note: >
      Приглашение в дело работает, но роль участника при этом не ставится:
      второго добавляют обычным участником и явно включают ему видимость
      «финансовое» (и «личное» — для разбора выписки) в момент приглашения.
      Название роли «супруг» из объявленной здесь пары само не приезжает —
      это отдельное умение, и его пока нет.

case_templates:
  - id: family-budget.month
    version: 2
    title: Бюджет семьи на месяц
    kind: task
    intake:
      - {key: month, title: За какой месяц ведём бюджет, kind: text, required: true}
      - {key: participants, title: Кто ведёт бюджет вместе с вами, kind: text}
    workflow:
      initial_state: intake
      states: [intake, tracking, done]
      terminal_states: [done]
      transitions:
        - {source: intake, target: tracking}
        - {source: tracking, target: done}
    required_capabilities: [dialog, case_patch]
    approvals:
      human_from: 3
      always_require: []

    # ЗАКРЕПЛЁННАЯ ЛЕСТНИЦА, тот же довод, что у «Деньги семьи»: анкета идёт
    # сама и не ждёт человека, а разбор выписки и таблицу просят тогда, когда
    # есть что разбирать. Пусти их подряд — прогон дойдёт до разбора раньше,
    # чем человек положит выписку в дело, и разберёт пустоту.
    run_plan:
      - step: intake
        title: Собрать, кто ведёт бюджет и на какой месяц
        policy:
          allowed_ops: [add_panel]
          include_history: true
          may_send_to_model: true
          sensitivity_scope: [normal]

      # ОБЛАСТЬ ШАГА — ВЫПИСКА НЕСЁТ И ДЕНЬГИ, И СВЕДЕНИЯ О ЧЕЛОВЕКЕ РАЗОМ:
      # в ней имена магазинов, даты, места. Открываем ровно то, что нужно —
      # normal + financial + pii, — а не всё дело разом.
      #
      # ПРАВКА ТАБЛИЦЫ ЗДЕСЬ ЖЕ: разобрав выписку, агент вносит суммы в уже
      # заведённую общую таблицу (`update_table_cells`). Такая правка идёт
      # без отдельного подтверждения — её видно в таблице и в журнале дела,
      # а ячейку, которую человек поправил после чтения агентом, площадка не
      # перезапишет.
      - step: statement_review
        title: Разобрать выписку, которую вы положили в дело
        on_request: true
        min_assurance: 2
        policy:
          allowed_ops: [add_panel, update_table_cells]
          include_history: true
          may_send_to_model: true
          sensitivity_scope: [normal, financial, pii]

      # ТАБЛИЦА — ОБЩАЯ, В САМОМ ДЕЛЕ (с версии пака 1.2.0; раньше —
      # черновик документа, который каждый правил у себя). Площадка обязывает
      # всякий шаг с `add_table` быть `on_request` и с `min_assurance` не
      # ниже 2 — это не соглашение автора, а проверка, падающая при загрузке
      # пакета. Род таблицы площадка ставит по области шага: здесь это
      # «финансовое», и увидит таблицу тот, кому оно открыто.
      - step: sheet
        title: Завести общую таблицу бюджета
        on_request: true
        min_assurance: 2
        policy:
          allowed_ops: [add_table]
          include_history: true
          may_send_to_model: true
          sensitivity_scope: [normal, financial]

      - step: month_close
        title: Подвести итог месяца
        on_request: true
        min_assurance: 2
        policy:
          allowed_ops: [add_panel, update_table_cells]
          include_history: true
          may_send_to_model: true
          sensitivity_scope: [normal, financial]

    done_criteria:
      - Названо, куда за месяц уходили деньги и сколько осталось от бюджета.
      - В деле одна общая таблица бюджета, которую видят и правят оба супруга с открытым «финансовым».
      - Прямо сказано, чего площадка не делает — выписку из банка забирают и кладут в дело люди сами.

agents:
  - id: talk
    title: Разговор про бюджет вдвоём
    # Местная модель площадки: разговор до дела не видит ничего чувствительнее
    # обычных сведений, и гонять его через внешний мост незачем.
    model: gpt-oss-20b
    label: family_budget_talk
    side: need_help
    min_assurance: 0
    match_priority: 45
    capabilities: [dialog]
    sensitivity_clearance: [normal]
    purpose: >
      Объясняешь, как двое заводят одно дело о бюджете, что оно умеет и что
      не умеет: в деле заводится общая таблица бюджета, которую правят оба,
      но это не гугл-таблица — формул нет, столбцы задаются при создании, а
      правку другого видно через несколько секунд, не мгновенно; выписку в
      дело кладёт человек сам, файлом PDF. Говоришь, как позвать в это же
      дело второго супруга: дать ему право писать в деле и отдельно открыть
      видимость финансовых сведений. Сумм, остатков и
      номеров счетов в этом разговоре не спрашиваешь — это уже в деле, после
      входа обоих.

      Просят «заведи дело о бюджете» — начинай не с отказа: дело заводится
      одним нажатием, и это стоит сказать прямо, а дальше уже спрашивать, с
      чего им ближе начать.
    never:
      - "не спрашиваешь суммы, остатки и номера счетов в этом разговоре"
      - "не обещаешь гугл- или яндекс-таблицу, формулы и мгновенный показ правки другого — таблица живёт в деле, правка другого видна через несколько секунд"
      - "не обещаешь, что площадка сама заберёт выписку из банка или примет её письмом — выписку кладёт в дело человек, файлом PDF"
      - не советуешь, куда вложить деньги, и не оцениваешь решения банка
      - "не отказываешь без выхода: дело заводится одним нажатием, и это можно сказать сразу"

  - id: keeper
    title: Хранитель бюджета
    # Облачная модель того же направления, что и «Деньги семьи» — см.
    # объяснение вверху файла: местной с таким запасом контекста для разбора
    # выписки сегодня нет, а у российской облачной рвётся доступ каждые
    # тридцать минут без способа продлить его через API.
    model: mimo-v2.5
    label: family_budget_keeper
    side: need_help
    min_assurance: 2
    match_priority: 55
    capabilities: [dialog, case_patch]
    sensitivity_clearance: [normal, financial, pii]
    purpose: >
      Ведёшь дело о бюджете двоих: собираешь статьи расходов, разбираешь
      выписку, которую положили в дело файлом PDF, и ведёшь общую таблицу
      бюджета в деле. Когда просят завести таблицу — одну на месяц, со
      столбцами «Статья» (текст), «План, руб.» (число), «Факт, руб.» (число)
      и «Кто» (текст); вторую такую же не заводишь, если в деле она уже
      есть, — дополняешь имеющуюся. Суммы вносишь числом, без знака рубля.
      Правишь ячейку только с той версией, которую видишь в деле: если
      человек успел её поправить, остаётся его значение. Работаешь по принесённому — по выписке, по
      названным суммам, по словам обоих супругов. Не хватает данных —
      говоришь, каких именно, а не считаешь из догадки.
    never:
      - "не обещаешь подключение к банку и приём выписки письмом — файл в дело кладёт человек сам"
      - "не перезаписываешь ячейку, которую поправил человек: правишь только с версией, которую видишь в деле"
      - "не обещаешь гугл- или яндекс-таблицу и формулы — таблица живёт в деле, итоги по числам считаются сами"
      - не называешь сумм, которых не было в выписке или в словах человека
      - не советуешь, куда вложить деньги
      - "не пересказываешь операции и остатки супругу, которому в деле не открыт допуск к финансовым сведениям"

# ══ РЕЦЕПТЫ НАПРАВЛЕНИЯ ══
#
# Едут в свод при подъёме направления и ищутся словами вопроса — тот же
# довод, что у «Деньги семьи»: каждый абзац написан так, чтобы быть понятным
# сам по себе, потому что отдаётся выдержкой вокруг совпадения.
recipes:
  - key: kak_idet_delo_o_byudzhete_vdvoem
    title: 'Как идёт дело о бюджете вдвоём: с чего начинается и чем кончается'
    kind: инструкция
    about_abilities: [budget_sheet, statement_review, shared_sheet]
    body: |
          Дело о бюджете заводит сам человек одним нажатием — это одно движение,
          а не долгие согласования. Лестница шагов в нём закреплена снимком
          шаблона при заведении: порядок объявлен заранее и не переставляется.

          Первый шаг — «Собрать, кто ведёт бюджет и на какой месяц» — идёт сам,
          без просьбы: спрашивают месяц и кто в этом участвует. Сумм на этом
          шаге не спрашивают, ему денежный допуск не нужен.

          Шаг «Разобрать выписку, которую вы положили в дело» запускается по
          просьбе и требует подтверждённого входа: разбирают то, что человек
          сам добавил в дело файлом PDF, — куда уходит больше всего, что
          повторяется, что выбивается из обычного месяца. Если общая таблица
          бюджета в деле уже заведена, суммы из выписки агент вносит в неё.

          Шаг «Завести общую таблицу бюджета» тоже идёт по просьбе и требует
          подтверждённого входа. Агент заводит в самом деле таблицу со
          статьями, планом и фактом; перед тем как она появится, площадка
          спросит подтверждение. Дальше таблицу видят и правят оба супруга,
          кому открыто «финансовое», — это одна таблица на двоих, а не копия у
          каждого.

          Последний шаг — «Подвести итог месяца» — тоже по просьбе: называет,
          куда ушли деньги за месяц и сколько осталось от заложенного, и может
          дописать итог в общую таблицу.

          Три шага из четырёх идут по просьбе намеренно: пусти их подряд — и
          прогон дойдёт до разбора выписки раньше, чем человек положит её в
          дело, и разберёт пустоту.

  - key: kak_dobavit_vtorogo_supruga
    title: 'Как позвать второго супруга в то же дело о бюджете'
    kind: практика
    about_abilities: [spouse_invite_role]
    body: |
          Второго супруга добавляют в то же дело обычным участником — это
          работает сегодня. Но по умолчанию новый участник только читает и
          видит только обычные материалы дела: ни разбор выписки, ни общую
          таблицу бюджета он не увидит, пока ему не откроют видимость
          финансовых сведений, и не сможет править таблицу, пока ему не дадут
          право писать в деле.

          Открыть это нужно ЯВНО, в момент приглашения или сразу после: дать
          второму участнику право писать (не только читать) и включить род
          сведений «финансовое», а для разбора выписки — ещё и «личное»,
          потому что в выписке кроме сумм есть названия мест и даты. Без этого
          второй участник состоит в деле, но не видит и не правит того, из-за
          чего дело заводили вдвоём.

          Роль «супруг» сама по себе, отдельной надписью у участника, при
          этом не появляется: приглашение заводит обычного участника дела, а
          не переносит роль из объявленной здесь пары. Это не мешает работе —
          видимость решает не название роли, а явно открытый род сведений, —
          но название стоит знать заранее, чтобы не искать его на экране.

  - key: kak_polozhit_vypisku
    title: 'Как положить выписку банка в дело о бюджете'
    kind: инструкция
    about_abilities: [statement_review, bank_pull, bank_statement_by_mail]
    body: |
          Выписку в дело кладёте вы сами: выгружаете её в приложении или
          личном кабинете банка файлом PDF и добавляете в материалы дела.
          Дальше её можно попросить разобрать — шагом «Разобрать выписку,
          которую вы положили в дело».

          Забирать выписку из банка самостоятельно площадка не умеет: у
          банков нет входа для стороннего сервиса к операциям личного счёта.
          Принимать выписку письмом на адрес дела площадка тоже пока не
          умеет — это в плане, но не сегодня.

          Разбор идёт по тексту принесённой выписки: суммы, даты и то, что
          повторяется из месяца в месяц. Того, чего в выписке не было,
          собеседник не досчитывает и не предполагает — при нехватке данных
          он скажет, какие именно нужны.

  - key: kak_vesti_obshchuyu_tablitsu
    title: 'Как вдвоём править общую таблицу бюджета и что будет, если поправить одно и то же'
    kind: инструкция
    about_abilities: [shared_sheet, budget_sheet]
    body: |
          Общая таблица бюджета живёт в самом деле, на рабочем месте дела. Её
          видят оба супруга, кому открыто «финансовое», и правят те, у кого
          есть право писать в деле. Это одна таблица на двоих, а не копия у
          каждого.

          Каждая ячейка сохраняется отдельно, сразу после правки. Если один
          супруг поправил статью, а другой — сумму в той же строке, сохранятся
          обе правки: разные ячейки друг другу не мешают.

          Если двое поправили ОДНУ и ту же ячейку почти одновременно, первая
          правка сохраняется, а второй видит, что там уже записано, кем и
          когда, и сам выбирает — оставить или записать своё. Молча ничего не
          пропадает.

          Правку другого открытая таблица подтягивает через несколько секунд,
          а правку агента — когда он закончит шаг. Это не мгновенный показ, как
          в гугл-таблицах, и формул в таблице нет: итоги по числовым столбцам
          считаются сами. Столбцы задаются при создании таблицы и потом не
          меняются. Строку можно снять — снятая строка не пропадает бесследно,
          в журнале дела видно, кто и когда её снял. Таблицу можно скачать
          файлом CSV и открыть в своей программе.

  - key: chego_zdes_net
    title: 'Подключите наш банк и заведёте гугл-таблицу? Чего здесь по бюджету семьи не делаем'
    kind: практика
    about_abilities: [bank_pull, bank_statement_by_mail, spouse_invite_role]
    body: |
          Общая таблица бюджета, которую правят оба супруга, у площадки есть,
          но живёт она в самом деле: гугл- и яндекс-таблиц мы не заводим,
          формул в таблице нет, а правку другого видно через несколько секунд,
          не мгновенно.

          Забирать выписки из банка сами мы не умеем: у банков нет входа для
          стороннего сервиса к операциям личного счёта. Принимать выписку
          письмом на собственный адрес дела с проверкой, что оно действительно
          от банка, тоже пока не умеем.

          Роль «супруг» второму участнику при приглашении сама не проставляется:
          его добавляют обычным участником дела, дают право писать и явно
          открывают видимость финансовых сведений.

          Советов, куда вложить деньги, здесь не дают — бюджет семьи это не
          инвестиции. Спор с банком ведёт право, а не бюджет семьи; покупку
          жилья ведёт не это направление, а недвижимость.
