# Проверки «не сломано»: дело о бюджете не должно падать ни в одном из этих
# состояний, от первого вопроса без входа до второго участника без допуска.
fixtures:
  - name: вопрос про бюджет без заведённого дела
    intake: {}
    ожидается:
      агент: talk
      просит_вход: false
      называет_обе_работы: [statement_review, budget_sheet]

  - name: дело заведено на месяц
    intake:
      month: сентябрь 2026
      participants: муж и жена
    ожидается:
      шаблон: family-budget.month
      первый_шаг_идёт_сам: intake
      следующие_по_просьбе: [statement_review, sheet, month_close]

  - name: выписка положена в дело файлом PDF
    intake:
      month: сентябрь 2026
      participants: муж и жена
    материал:
      вид: pdf
      имя: vypiska_sentyabr.pdf
    вход: подтверждён
    ожидается:
      шаг: statement_review
      род_сведений: [normal, financial, pii]

  - name: просьба собрать таблицу без выписки
    intake:
      month: сентябрь 2026
      participants: муж и жена
    вход: подтверждён
    ожидается:
      шаг: sheet
      результат: черновик_документа
      не_ссылка_на_общую_таблицу: true

  - name: второй супруг добавлен без допуска financial
    участники:
      - роль: владелец дела
        may_see: [normal, financial, pii]
      - роль: второй супруг
        may_see: [normal]
    ожидается:
      второй_супруг_видит_операции: false
      второй_супруг_видит_таблицу: false
