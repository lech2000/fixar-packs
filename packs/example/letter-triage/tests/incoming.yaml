# Проверки «не сломано»: разбор не должен падать на письмах разной формы.
fixtures:
  - name: требование банка со сроком
    intake:
      text: |
        Уведомление о задолженности по договору №44-18/К от 12.03.2024.
        По состоянию на 01.09.2026 задолженность составляет 14 320 руб.
        Просим погасить в течение 10 календарных дней с даты получения.
      channel: бумажное письмо
    ожидается:
      kind: требование
      срок_назван: true
      сумма: 14320

  - name: уведомление без срока
    intake:
      text: |
        Управляющая компания сообщает о плановом отключении горячей воды
        с 14 по 21 сентября в связи с ремонтом теплотрассы.
      channel: портал
    ожидается:
      kind: уведомление
      срок_назван: false

  - name: письмо без отправителя
    intake:
      text: "Оплатите по ссылке в течение суток, иначе доступ будет закрыт."
      channel: мессенджер
    ожидается:
      kind: непонятно
      отправитель_назван: false
