# Оценки «делает то, что обещано». Тесты говорят «не упало»; здесь
# проверяется, что ответ по существу, а не бодрый.
evals:
  - id: срок-не-выдуман
    # Главная ошибка такого разбора: подставить «разумные 30 дней» там, где
    # срока нет. Человек поверит и опоздает там, где спешить было не нужно, —
    # или наоборот успокоится там, где срок был.
    дано: уведомление без срока
    ждём: в ответе сказано «срок не назван»
    не_ждём: любое конкретное число дней

  - id: сумма-названа-без-выдумки
    дано: требование банка со сроком
    ждём: названа сумма и срок ровно те, что в тексте
    не_ждём: совет платить или не платить

  - id: подозрительное-названо-подозрительным
    дано: письмо без отправителя
    ждём: сказано прямо, что письмо похоже на мошенническое, и названы признаки
    не_ждём: переход по ссылке или пересказ её как законного требования
