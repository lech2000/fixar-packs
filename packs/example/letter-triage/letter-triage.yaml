# Направление: разбор письма.
#
# Человек приносит текст — письмо из управляющей компании, от банка, с
# портала, бытовую записку — и хочет знать: что это, от кого, чего от него
# хотят и к какому сроку. Пак отвечает по ТЕКСТУ, который дали, и только
# по нему: не выдумывает срока, которого в письме нет, и не советует, что
# делать по существу требования.
#
# ЧУВСТВИТЕЛЬНОСТЬ pii, А НЕ normal. В письме может быть чужая переписка:
# адреса, суммы, номера договоров, имена третьих лиц. Пометить это «обычным»
# значило бы разложить чужое письмо по общим полкам.

id: letter-triage
title: Разбор письма
version: 1
description: >
  Разбор письма: что за бумага пришла, от кого, чего хотят и к какому сроку.
  Толкования норм права, советов «платить или нет» и отправки чего бы то ни
  было в этом направлении нет.

entity_types:
  - type: letter
    title: Письмо
    plural: Письма
    sensitivity: pii
    fields:
      - {key: sender, title: От кого, kind: text, required: true}
      - {key: subject, title: О чём, kind: text, required: true}
      - {key: deadline, title: Срок ответа, kind: date}
      - {key: amount, title: Сумма требования, kind: number, unit: руб.}
      - {key: kind, title: Что это, kind: enum,
         options: [уведомление, требование, счёт, приглашение, реклама, непонятно]}

case_templates:
  - id: letter-triage.review
    version: 1
    title: Разбор письма
    kind: task
    intake:
      - {key: text, title: Текст письма, kind: text, required: true}
      - {key: received, title: Когда получено, kind: date}
      - {key: channel, title: Как пришло, kind: enum,
         options: [бумажное письмо, электронная почта, мессенджер, портал, вручили лично]}
    # Состояния и переходы — машинные идентификаторы: по ним ходит код.
    workflow:
      initial_state: intake
      states: [intake, triaged, done]
      terminal_states: [done]
      transitions:
        - {source: intake, target: triaged}
        - {source: triaged, target: done}
    required_capabilities: [dialog, case_patch]
    approvals:
      human_from: 2
      always_require: []
    done_criteria:
      - Названо, что это за письмо и от кого оно, если это видно из текста.
      - Названо, чего от человека хотят и к какому сроку.
      - Сказано прямо, что срок не назван, если в тексте его нет.

agents:
  - id: triage
    title: Разбор письма
    purpose: >
      Разбираешь письмо, которое принёс человек: называешь, что это за
      бумага, от кого она, чего от человека хотят и к какому сроку. Отвечаешь
      ПО ТЕКСТУ, который дали, и только по нему. Если срока в тексте нет —
      прямо говоришь «срок не назван», а не подставляешь разумное число. Если
      письмо выглядит подозрительным или мошенническим — говоришь об этом
      прямо и называешь признаки, по которым так решил.
    label: letter_triage_review
    side: need_help
    # Две способности: вести разговор и записывать разбор в дело. Ни выхода
    # к источникам, ни поиска — разбирается принесённое, а не найденное.
    capabilities: [dialog, case_patch]
    tools: []
    web_search: false
    match_priority: 50
    max_calls: 12
    stages: [входящее, разбор]
    sensitivity_clearance: [normal, pii]
    never:
      - не выдумываешь срок, которого нет в тексте письма
      - "не толкуешь норму права: называешь, на что письмо ссылается, и оставляешь толкование юристу"
      - не советуешь платить или не платить и не оцениваешь исход спора
      - "не додумываешь отправителя: если из текста не ясно, кто прислал письмо, так и говоришь"
      - "не отправляешь ничего никуда: только называешь, что видишь в тексте"
