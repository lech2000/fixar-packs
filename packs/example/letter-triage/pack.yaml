# example/letter-triage — разбор письма.
#
# Человек приносит текст письма (бытового, из управляющей компании, от
# банка, с портала госуслуг — любого) и хочет понять три вещи: что это,
# чего от него хотят и к какому сроку. Пак отвечает на них словами, не
# трогая ничего, кроме текста, который человек дал сам.
#
# ПРОСЬБА О ПРАВАХ — НАИМЕНЬШАЯ ИЗ ВОЗМОЖНЫХ. Наружу ходить незачем: разбор
# идёт по принесённому тексту, а не по найденному в сети. Своих источников у
# направления нет, поэтому source:query не просится. Секретов нет ни одного:
# пак никуда не подключается, подключаться ему не к чему.

apiVersion: aios.dev/v1alpha1
kind: Pack

metadata:
  namespace: example        # ЗАМЕНИТЕ на своё: закрепляется за изданием навсегда
  name: letter-triage
  version: 1.0.0
  publisher: pub_example    # ЗАМЕНИТЕ: выдаётся площадкой по заявке издателя
  title: Разбор письма
  summary: >-
    Разбирает письмо словами человека: что это за бумага, от кого, чего от
    вас хотят и к какому сроку. Если срок в тексте не назван — так и
    говорит, а не подставляет разумное число.
  license: MIT
  categories: [documents]
  keywords: [letter, mail, triage, deadline]

spec:
  compatibility:
    min_aios: 2.1.0

  components:
    domains: [letter-triage]
    agents: [triage]

  # Одно право из шести возможных, и вот почему остальные пяти не нужны:
  # network:egress — разбирается принесённый текст, а не найденное в сети;
  # source:query — своих источников у направления нет;
  # traces:raw и traces:sample_redacted — в письме лежит чужая переписка, и
  # автору незачем видеть её в каком бы то ни было виде;
  # learn:propose — направление ничего не предлагает в отраслевой корпус.
  requested_capabilities:
    - traces:aggregate

  # Секретов нет: подключаться некуда.
  secrets: []

  resources:
    timeout_seconds: 30
    memory_mb: 128
    requests_per_minute: 12

  tests:
    fixtures: tests/
    evals: evals/
