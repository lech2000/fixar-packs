# Проверки «не сломано»: дело о бюджете не должно падать ни в одном из этих
# состояний, от первого вопроса без входа до второго участника без допуска.
fixtures:
  - name: вопрос про бюджет без заведённого дела
    intake: {}
    ожидается:
      агент: talk
      просит_вход: false
      называет_обе_работы: [statement_review, budget_sheet]

  - name: дело заведено на месяц
    intake:
      month: сентябрь 2026
      participants: муж и жена
    ожидается:
      шаблон: family-budget.month
      первый_шаг_идёт_сам: intake
      следующие_по_просьбе: [statement_review, sheet, month_close]

  - name: выписка положена в дело файлом PDF
    intake:
      month: сентябрь 2026
      participants: муж и жена
    материал:
      вид: pdf
      имя: vypiska_sentyabr.pdf
    вход: подтверждён
    ожидается:
      шаг: statement_review
      род_сведений: [normal, financial, pii]

  - name: просьба собрать таблицу без выписки
    intake:
      month: сентябрь 2026
      participants: муж и жена
    вход: подтверждён
    ожидается:
      шаг: sheet
      операция: add_table
      результат: общая_таблица_в_деле
      род_таблицы: financial
      ждёт_подтверждения: true
      столбцы: [Статья, "План, руб.", "Факт, руб.", Кто]
      не_черновик_документа: true

  - name: разбор выписки при заведённой таблице
    intake:
      month: сентябрь 2026
      participants: муж и жена
    таблица: заведена
    материал:
      вид: pdf
      имя: vypiska_sentyabr.pdf
    вход: подтверждён
    ожидается:
      шаг: statement_review
      операция: update_table_cells
      ждёт_подтверждения: false
      вторая_таблица_не_заводится: true

  - name: двое поправили одну и ту же ячейку
    таблица: заведена
    участники:
      - роль: владелец дела
        права: [read, comment]
        may_see: [normal, financial, pii]
      - роль: второй супруг
        права: [read, comment]
        may_see: [normal, financial]
    правки:
      - {кто: владелец дела, ячейка: "Продукты / Факт, руб.", версия: 1, значение: "18500"}
      - {кто: второй супруг, ячейка: "Продукты / Факт, руб.", версия: 1, значение: "19000"}
    ожидается:
      сохранено: "18500"
      второй_видит_спор: true
      правка_второго_не_записана_молча: true

  - name: агент не перезаписывает правку человека
    таблица: заведена
    правки:
      - {кто: агент, прочёл_версию: 1}
      - {кто: владелец дела, ячейка: "Кафе / Факт, руб.", версия: 1, значение: "4200"}
      - {кто: агент, ячейка: "Кафе / Факт, руб.", версия: 1, значение: "3900"}
    ожидается:
      сохранено: "4200"

  - name: второй супруг добавлен без допуска financial
    участники:
      - роль: владелец дела
        may_see: [normal, financial, pii]
      - роль: второй супруг
        may_see: [normal]
    ожидается:
      второй_супруг_видит_операции: false
      второй_супруг_видит_таблицу: false
      второй_супруг_правит_таблицу: false
